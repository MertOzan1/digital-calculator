
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🧮 Digital Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🧮 DIGITAL CALCULATOR</h1>

    <div id="calculator">

        <p id="result" class="off">0</p>

        <div id="buttons">
            <button>C</button>
            <button>⌫</button>
            <button>%</button>
            <button>÷</button>
            <button>×</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>=</button>

            <button>0</button>
            <button>.</button>
            <button id="power">⏻</button>
        </div>

    </div>

    <p id="version">Version: 1.0</p>

    <script type="module" src="script.js"></script>

</body>
</html>
